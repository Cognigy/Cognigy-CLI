sonar.projectKey=com.nice.cognigy-alu-Cognigy-CLI
sonar.projectName=cognigy-alu-Cognigy-CLI

sonar.sources=.
sonar.tests=.
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/vendor/**,\
  **/coverage/**,\
  **/*.gen.go,\
  **/*.gen.ts

sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/*_test.go,\
  **/__tests__/**

# Coverage - emitted by the "Run tests with coverage" step in sonarqube.yml.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.qualitygate.wait=true
